[package]
name = "peanut_task"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1", features = ["consensus", "provider-http", "provider-ws", "sol-types"] }
ccxt-core = "0.1.4"
ccxt-exchanges = "0.1.4"
ccxt-rust = { version = "0.1.4", features = ["full"] }
rust_decimal = "1"
rust_decimal_macros = "1"
url = "2.5"
dotenvy = "0.15.7"
getrandom = "0.3.4"
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa"] }
reqwest = { version = "0.12", features = ["json"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10.8"
sha3 = "0.10.8"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
httpmock = "0.8"
rustls = { version = "0.23", features = ["aws_lc_rs"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "peanut_task"
path = "src/main.rs"

[[bin]]
name = "price_impact_cli"
path = "scripts/price_impact_cli.rs"

[[bin]]
name = "chain_analyzer"
path = "scripts/transaction_analyzer_cli.rs"

[[bin]]
name = "integration_test"
path = "scripts/integration_test.rs"

[[bin]]
name = "orderbook_cli"
path = "scripts/orderbook_cli.rs"

[[bin]]
name = "rebalancer_cli"
path = "scripts/rebalancer_cli.rs"

[[bin]]
name = "pnl_cli"
path = "scripts/pnl_cli.rs"
